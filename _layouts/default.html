<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <meta name="theme-color" content="#F5F3ED">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2216%22 y=%228%22 width=%2268%22 height=%2284%22 rx=%228%22 fill=%22%23FFEFAE%22 stroke=%22%2342533E%22 stroke-width=%228%22/><rect x=%2230%22 y=%2230%22 width=%2240%22 height=%228%22 fill=%22%2342533E%22/><rect x=%2230%22 y=%2248%22 width=%2240%22 height=%228%22 fill=%22%2342533E%22/><rect x=%2230%22 y=%2266%22 width=%2224%22 height=%228%22 fill=%22%2342533E%22/></svg>">
  {% feed_meta %}
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><i class="note-ico"></i>{{ site.author }}.txt<span class="dim">- 메모장</span></a>
      <button class="menu-btn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="site-nav" aria-label="메뉴">
        {% for c in site.data.categories %}
          <a href="{{ '/' | append: c.slug | append: '/' | relative_url }}"{% if page.cat == c.slug or page.categories contains c.slug %} class="active"{% endif %}>{{ c.name }}<small>{{ c.short }}</small></a>
        {% endfor %}
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>소개<small>ME</small></a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© {{ site.time | date: "%Y" }} {{ site.author }}.txt</span>
      <a href="https://github.com/{{ site.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <span>UTF-8</span>
    </div>
  </footer>
  <script>
    // 우측 메뉴 버튼(☰): 눌러서 메뉴 펼치기/접기. 링크 클릭, Esc, 바깥 클릭 시 닫힘
    (function () {
      var btn = document.querySelector('.menu-btn');
      var header = document.querySelector('.site-header');
      if (!btn || !header) return;
      function setOpen(open) {
        header.classList.toggle('menu-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
      }
      btn.addEventListener('click', function () { setOpen(!header.classList.contains('menu-open')); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
      document.addEventListener('click', function (e) { if (!header.contains(e.target)) setOpen(false); });
      header.querySelectorAll('.nav a').forEach(function (a) { a.addEventListener('click', function () { setOpen(false); }); });
    })();
  </script>
</body>
</html>
